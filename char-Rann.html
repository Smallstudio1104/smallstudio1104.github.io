<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMALL - 雷恩</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/ddotapoxu/image/upload/v1770658297/ICON2.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #ffffff;
            color: #2d3436;
        }

        /* HEADER */
                .header {
            text-align: center;
            padding: 2rem 1rem 1rem;
            position: relative;
            background: url(https://res.cloudinary.com/ddotapoxu/image/upload/v1770654939/SMALL_PATTERN_BG.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .header { padding: 1rem; }

        .nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .nav-left, .nav-right {
            display: flex;
            gap: 1.5rem;
        }

        .nav a {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2d3436;
            text-decoration: none;
            letter-spacing: 0.05em;
        }

        .nav a:hover { text-decoration: underline; }

        .nav-logo img {
            max-height: 70px;
            height: auto;
            cursor: pointer;
        }

        .page-label {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: #636e72;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        /* PROFILE SECTION */
        .profile-section {
            max-width: 820px;
            margin: 2.5rem auto 0;
            padding: 0 2rem;
        }

        .char-title {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 0.2em;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .profile-card {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 0;
            border: 2px solid #2d3436;
        }

        .profile-img-col {
            border-right: 2px solid #2d3436;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            min-height: 300px;
            background: #fff;
        }

        .profile-img-col .placeholder {
            font-size: 8rem;
            line-height: 1;
        }

        .profile-img-col img {
            max-width: 100%;
            max-height: 260px;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }

        .profile-info-col {
            padding: 2rem 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .info-block-label {
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #2d3436;
            margin-bottom: 0.4rem;
        }

        .info-block-value {
            font-size: 0.95rem;
            color: #636e72;
            line-height: 1.8;
        }

        /* QUOTE BLOCK */
        .quote-block {
            max-width: 820px;
            margin: 2.5rem auto 0;
            padding: 0 2rem;
        }

        .quote-inner {
            background: #f5c400;
            padding: 1.8rem 2.5rem;
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.8;
            color: #2d3436;
        }

        /* DIVIDER */
        .divider {
            width: 100%;
            border: none;
            border-top: 1.5px solid #e0e0e0;
            margin: 3rem 0 0;
        }

        /* GANG NAV */
        .gang-nav {
            padding: 3rem 2rem 4rem;
            max-width: 820px;
            margin: 0 auto;
            text-align: center;
        }

        .gang-nav h3 {
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-decoration: underline;
            text-underline-offset: 4px;
            margin-bottom: 2rem;
        }

        .gang-mini-grid {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1.2rem;
        }

        .mini-card {
            width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            color: #2d3436;
            transition: transform 0.2s ease;
        }
        .mini-card:hover { transform: translateY(-3px); }
        .mini-card:hover .mini-name { text-decoration: underline; }

        .mini-img-box {
            width: 100px;
            height: 100px;
            border: 2.5px solid #f5c400;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: #fff;
        }

        .mini-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .mini-name {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .mini-card.active .mini-img-box {
            border-color: #2d3436;
            border-width: 3px;
        }

        /* FOOTER */
        .footer {
            background: #2d3436;
            color: white;
            padding: 1.5rem 1rem;
        }

        .footer-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-left { font-size: 0.9rem; color: #dfe6e9; }

        .footer-logo {
            height: 50px;
            width: auto;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .footer-logo:hover { transform: scale(1.1); }

        @media (max-width: 640px) {
            .profile-card { grid-template-columns: 1fr; }
            .profile-img-col { border-right: none; border-bottom: 2px solid #2d3436; min-height: 200px; }
            .profile-info-col { padding: 1.5rem; }
            .back-link { font-size: 0.85rem; top: 1.2rem; left: 1rem; }
        }
    </style>
</head>
