<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMALL - 角色介紹</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/ddotapoxu/image/upload/v1770658297/ICON2.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="char-template.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #ffffff;
            color: #2d3436;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 2rem 1rem 1rem;
            position: relative;
            background: url(https://res.cloudinary.com/ddotapoxu/image/upload/v1770654939/SMALL_PATTERN_BG.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .header { padding: 1rem; }

        .nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .nav-left, .nav-right {
            display: flex;
            gap: 1.5rem;
        }

        .nav a {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2d3436;
            text-decoration: none;
            letter-spacing: 0.05em;
        }

        .nav a:hover { text-decoration: underline; }

        .nav-logo img {
            max-height: 70px;
            height: auto;
            cursor: pointer;
        }

        .page-label {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            color: #636e72;
            text-transform: uppercase;
            margin-top: 0.5rem;
        }

        /* ===== ABOUT SECTION ===== */
        .about-section {
            max-width: 700px;
            margin: 3rem auto 3rem;
            padding: 0 2rem;
            text-align: center;
        }

        .about-section h2 {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #2d3436;
            margin-bottom: 1.2rem;
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        .about-section p {
            font-size: 1rem;
            color: #636e72;
            line-height: 2;
        }

        /* ===== DIVIDER ===== */
        .divider {
            width: 100%;
            border: none;
            border-top: 1.5px solid #e0e0e0;
            margin: 0;
        }

        /* Meet the Gang uses shared `char-template.css` */

        /* ===== FOOTER ===== */
        .footer {
            background: #2d3436;
            color: white;
            padding: 1.5rem 1rem;
        }

        .footer-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-left { font-size: 0.9rem; color: #dfe6e9; }

        .footer-logo {
            height: 50px;
            width: auto;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .footer-logo:hover { transform: scale(1.1); }

        @media (max-width: 600px) {
            .back-link { font-size: 0.85rem; top: 1.2rem; left: 1rem; }
            .char-img-box { width: 130px; height: 130px; }
            .char-card { width: 145px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <nav class="nav">
            <div class="nav-left">
                <a href="index.html">漫畫</a>

            </div>
            <div class="nav-logo">
                <img src="https://res.cloudinary.com/ddotapoxu/image/upload/v1770606840/SMALLL.png"
                    alt="SMALL" onclick="location.href='index.html'">
            </div>
            <div class="nav-right">
                <a href="#">連載</a>
                <a href="#">更多</a>
            </div>
        </nav>
    </header>

    <!-- ABOUT -->
    <section class="about-section">
        <h2>關於這部漫畫</h2>
        <p>
            在這個不大不小的世界裡，<br>
            住著一個戴棒球帽的浪漫主義者、一隻見錢眼開的兔子、<br>
            一個沒什麼天使氣質的天使，還有一個躲在面具後面的小惡魔。<br><br>
            這是他們平凡又荒謬的日常。
        </p>
    </section>

    <hr class="divider">

                </div>
                <div class="char-name">雷恩</div>

            <a class="char-card" href="char-Hook.html">

                </div>
                <div class="char-name">虎仔</div>
            </a>

            <a class="char-card" href="char-Cled.html">

            <a class="char-card" href="char-Guden.html">

                </div>
                <div class="char-name">小蝸牛股等</div>

        </div>

    <footer class="footer">

        <div class="footer-links">
